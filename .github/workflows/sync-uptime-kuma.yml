name: Sync Uptime-Kuma

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点运行
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: 'louislam/uptime-kuma'
  TAG: '2'
  IMAGE_NAME: 'uptime-kuma' # 最终在 GHCR 中的名称

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录到 GitHub 容器注册表
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 使用内置 Token，需确保仓库权限开启

      - name: 执行同步并输出日志
        run: |
          LOG_FILE="sync-${{ env.IMAGE_NAME }}.log"
          echo "=== 同步开始: $(date) ===" > $LOG_FILE
          
          echo "正在拉取镜像 ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }}..." >> $LOG_FILE
          docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }} >> $LOG_FILE 2>&1
          
          ACTOR_LOWER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="${{ env.REGISTRY }}/${ACTOR_LOWER}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          
          echo "正在打标签: $TARGET_IMAGE" >> $LOG_FILE
          docker tag ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }} $TARGET_IMAGE
          
          echo "正在推送到 GHCR..." >> $LOG_FILE
          docker push $TARGET_IMAGE >> $LOG_FILE 2>&1
          
          echo "=== 同步结束: $(date) ===" >> $LOG_FILE
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV

      - name: 上传日志为 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOG_FILE }}
          path: ${{ env.LOG_FILE }}

      - name: 自动提交日志到仓库 (可选)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.LOG_FILE }}
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sync log" && git push)
